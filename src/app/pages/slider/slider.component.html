<section class="hero-slider">

    <!-- Current slide -->
    <div class="hero-image" [style.background-image]="'url(' + slides[activeSlide].image + ')'"></div>

    <!-- New slide transition -->
    <div class="splitting" [ngClass]="slides[nextSlideIndex].animation" [class.animate]="isAnimating">
        <div class="cell-grid">

            <div class="cell" *ngFor="let cell of cells" [style.--col-index]="cell.col">
                <div class="cell-inner" [style.background-image]="
            'url(' + slides[nextSlideIndex].image + ')'
          "></div>
            </div>

        </div>
    </div>

</section>
