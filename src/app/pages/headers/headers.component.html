
<div class="laptopview">
  <div class="siddhivinayak-loader" [class.loader-hide]="loaderFinished">

    <!-- LOGO ASSEMBLY -->
    <div class="logo-assembly" [class.assemble]="startAssembly" [class.complete]="logoComplete">

      <img src="assets/animation/11.png" class="logo-piece piece-1" alt="Logoimages" />

      <img src="assets/animation/33.png" class="logo-piece piece-2" alt="Logoimages" />

      <img src="assets/animation/22.png" class="logo-piece piece-3" alt="Logoimages" />

      <img src="assets/animation/44.png" class="logo-piece piece-4" alt="Logoimages">
    </div>

    <!-- COMPANY NAME -->
    <div class="company-name" [class.show-name]="showName">
      SIDDHIVINAYAK <br>

      <span class="span">
        ENGINEERING SOLUTIONS PVT. LTD.
      </span>

      <hr>

      <span class="effect">
        EFFICIENT | SAFE | RELIABLE | IN TIME
      </span>
    </div>


  </div>
</div>
  

<div class="mobileview">
  <div class="siddhivinayak-loader" [class.loader-hide]="loaderFinished">

    <!-- LOGO ASSEMBLY -->
    <div class="logo-assembly" [class.assemble]="startAssembly" [class.complete]="logoComplete">

      <img src="assets/animation/1.png" class="logo-piece piece-1" alt="Logoimages" />

      <img src="assets/animation/3.png" class="logo-piece piece-2" alt="Logoimages" />

      <img src="assets/animation/2.png" class="logo-piece piece-3" alt="Logoimages" />

      <img src="assets/animation/4.png" class="logo-piece piece-4" alt="Logoimages">
    </div>

    <!-- COMPANY NAME -->
    <div class="company-name" [class.show-name]="showName">
      SIDDHIVINAYAK <br>
      <span class="span">ENGINEERING SOLUTIONS PVT. LTD.</span>
      <hr>
      <span class="effect">EFFICIENT | SAFE | RELIABLE | IN TIME</span>
    </div>

  </div>
</div>


<!-- YOUR WEBSITE -->
<div class="website" [class.website-visible]="loaderFinished">
 
  <section class="hero">
  </section>
</div>
